<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
</head>
<body>

    <h1>Creá tu cuenta 🐶</h1>
    <p>Completá tu perfil para encontrar el match perfecto</p>

    <form name="Crear Cuenta ">

        <label for="nombre">NOMBRE COMPLETO</label><br>
        <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre"><br><br>

        <label for="email">EMAIL</label><br>
        <input type="email" id="email" name="email" placeholder="usuario@dominio.com"><br><br>

        <label for="password">CONTRASEÑA</label><br>
        <input type="password" id="password" name="password" placeholder="********"><br>
        <small>Usá letras y números para mayor seguridad</small><br><br>

        <label for="ubicacion">UBICACIÓN</label><br>
        <input type="text" id="ubicacion" name="ubicacion" placeholder="Cordoba, Argentina"><br><br>

        <p>Contanos un poco sobre vos</p>
        <p>Elegí todas las opciones que te representen. Las usamos para el sistema de match.</p>

        <label><input type="checkbox" name="tags" value="Persona sola"> Persona sola</label><br>
        <label><input type="checkbox" name="tags" value="Familia"> Familia</label><br>
        <label><input type="checkbox" name="tags" value="Busco adoptar"> Busco adoptar</label><br>
        <label><input type="checkbox" name="tags" value="Doy en adopcion"> Persona sola</label><br>
        <label><input type="checkbox" name="tags" value="Casa con jardin"> Casa con jardin</label><br>
        <label><input type="checkbox" name="tags" value="Departamento"> Departamento</label><br>
        <label><input type="checkbox" name="tags" value="Tengo otros animales"> Tengo otros animales</label><br>
        <label><input type="checkbox" name="tags" value="Sin otros animales"> Sin otros animales</label><br>
        <label><input type="checkbox" name="tags" value="Experiencia con mascotas"> Experiencia con mascotas</label><br>
        <label><input type="checkbox" name="tags" value="Primer mascota"> Primer mascota</label><br>
        <label><input type="checkbox" name="tags" value="Niños en casa"> Niños en casa</label><br>
        <label><input type="checkbox" name="tags" value="Busco vender"> Busco vender</label><br>
        
        <button type="submit">Crear cuenta</button>

    </form>

</body>

</html>
