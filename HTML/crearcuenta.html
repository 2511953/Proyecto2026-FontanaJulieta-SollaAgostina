<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/crearcuenta.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Momo+Trust+Display&display=swap"
        rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>Crear Cuenta</title>
</head>

<body>
    <div class="formulario">
        <h1>Creá tu cuenta 🐶</h1>
        <p>Completá tu perfil para encontrar el match perfecto</p>

        <form name="Crear Cuenta ">
            <label for="nombre">NOMBRE COMPLETO</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre"><br><br>

            <label for="email">EMAIL</label><br>
            <input type="email" id="email" name="email" placeholder="usuario@dominio.com"><br><br>

            <label for="password">CONTRASEÑA</label><br>
            <input type="password" id="password" name="password" placeholder="********"><br>
            <small>Usá letras y números para mayor seguridad</small><br><br>

            <label for="ubicacion">UBICACIÓN</label><br>
            <input type="text" id="ubicacion" name="ubicacion" placeholder="Cordoba, Argentina"><br><br>

            <p>CONTANOS UN POCO SOBRE VOS</p>
            <p>Elegí todas las opciones que te representen. Las usamos para el sistema de match.</p>
            <div>
                <label class="etiquetas"><input type="checkbox" class="etiquetas-input" name="tags"
                        value="Persona sola"> Persona sola</label>
                <label class="etiquetas"><input type="checkbox" class="etiquetas-input" name="tags" value="Familia">
                    Familia</label>
                <label class="etiquetas"><input type="checkbox" class="etiquetas-input" name="tags"
                        value="Busco adoptar"> Busco
                    adoptar</label>
                <label class="etiquetas"><input type="checkbox" class="etiquetas-input" name="tags"
                        value="Doy en adopcion"> Persona
                    sola</label>
                <label class="etiquetas"><input type="checkbox" class="etiquetas-input" name="tags"
                        value="Casa con jardin"> Casa con
                    jardin</label>
                <label class="etiquetas"><input type="checkbox" class="etiquetas-input" name="tags"
                        value="Departamento"> Departamento</label><br>
                <label class="etiquetas"><input type="checkbox" class="etiquetas-input" name="tags"
                        value="Tengo otros animales"> Tengo otros
                    animales</label>
                <label class="etiquetas"><input type="checkbox" class="etiquetas-input" name="tags"
                        value="Sin otros animales"> Sin otros
                    animales</label>
                <label class="etiquetas"><input type="checkbox" class="etiquetas-input" name="tags"
                        value="Experiencia con mascotas"> Experiencia
                    con
                    mascotas</label>
                <label class="etiquetas"><input type="checkbox" class="etiquetas-input" name="tags"
                        value="Primer mascota"> Primer
                    mascota</label>
                <label class="etiquetas"><input type="checkbox" class="etiquetas-input" name="tags"
                        value="Niños en casa"> Niños en
                    casa</label>
                <label class="etiquetas"><input type="checkbox" class="etiquetas-input" name="tags"
                        value="Busco vender"> Busco vender</label>
            </div>

            <a href="inicio.html">
                <button type="submit">Crear cuenta</button>
            </a>


            <p class="registro">
                ¿Ya tenés cuenta?
                <a href="iniciarsesion.html">Inicia sesión</a>
            </p>


        </form>
    </div>
</body>

</html>
