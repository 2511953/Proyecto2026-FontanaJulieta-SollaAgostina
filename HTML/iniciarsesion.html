<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/iniciarsesion.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Momo+Trust+Display&display=swap"
        rel="stylesheet">
    <title>Iniciar Sesion</title>
</head>

<body>
    <div>
        <h2>¡Bienvenido de vuelta! 🐾</h2>
        <p>Ingresá tus datos para continuar</p>

        <form name="Iniciar Sesion">

            <p>
                <label for="email">EMAIL</label>
                <input type="email" name="email" placeholder="usuario@dominio.com" id="email">
            </p>

            <p>
                <label for="contraseña">CONTRASEÑA</label>
                <input type="password" name="Contraseña" placeholder="*********" id="password">
            </p>

            <a href="#" class="olvidaste">¿Olvidaste tu contraseña?</a>

            <a href="inicio.html">
                <button type="submit" >Entrar</button>
            </a>
            

            <p class="registro">
                ¿No tenés una cuenta?
                <a href="#">Registrate</a>
            </p>

        </form>
    </div>
</body>

</html>
